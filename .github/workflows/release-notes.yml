# Example: regenerate release notes automatically whenever you push a tag.
# Copy this into your own repository to put Changeloom on autopilot.
name: Release Notes

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the range can be computed

      - name: Generate release notes
        uses: firemesscode/drevorod@v1
        with:
          release: ${{ github.ref_name }}
          changelog: CHANGELOG.md
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit the updated changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ github.ref_name }}" || echo "no changes"
          git push origin HEAD:main || echo "nothing to push"
